name: pcyear_bridge
description: 多源音乐桥 原生 App（安卓 / iOS / 鸿蒙），自带播放器，直连 WebDAV / 飞牛 / Subsonic 音源，可接入 SongLoft 服务器。
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  # 状态管理（轻量、稳定，便于后期扩展为 Riverpod/Bloc）
  provider: ^6.1.2
  # HTTP 客户端（连接 SongLoft 服务器 / 直连音源）
  http: ^1.2.2
  # WebDAV PROPFIND 响应（multistatus XML）解析
  xml: ^6.5.0
  # 路径处理
  path: ^1.9.0
  # Subsonic token（md5）
  crypto: ^3.0.3
  # 自带播放器（解码 + 后台 / 锁屏控制）
  just_audio: ^0.9.38
  audio_service: ^0.18.15
  # 本地持久化：音源配置、收藏、播放进度
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
